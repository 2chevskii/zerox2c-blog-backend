name: Build and deploy

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  context:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.vars.outputs.deploy }}
      environment: ${{ steps.vars.outputs.environment }}
      environment_url: ${{ steps.vars.outputs.environment_url }}
      image: ${{ steps.vars.outputs.image }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      default_app_port: ${{ steps.vars.outputs.default_app_port }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve variables
        id: vars
        shell: bash
        run: bash scripts/resolve-deployment-context.sh

      - name: Log resolved deployment context
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "deploy=${{ steps.vars.outputs.deploy }}"
          echo "environment=${{ steps.vars.outputs.environment }}"
          echo "environment_url=${{ steps.vars.outputs.environment_url }}"
          echo "image=${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.image_tag }}"
          echo "default_app_port=${{ steps.vars.outputs.default_app_port }}"

  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Log .NET environment
        run: |
          dotnet --version
          dotnet --info

      - name: Restore
        run: |
          echo "Restoring solution ZeroX2C.Blog.slnx"
          dotnet restore ZeroX2C.Blog.slnx

      - name: Build
        run: |
          echo "Building solution ZeroX2C.Blog.slnx in Release configuration"
          dotnet build ZeroX2C.Blog.slnx --configuration Release --no-restore

  container:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    needs:
      - context
      - build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Building API Docker image zerox2c-blog-api:test"
          docker build --target runtime --tag zerox2c-blog-api:test .
          docker image ls zerox2c-blog-api:test

      - name: Smoke test Docker image
        shell: bash
        run: |
          echo "Running API Docker smoke test"
          bash scripts/smoke-docker-image.sh zerox2c-blog-api:test

      - name: Log in to GHCR
        if: needs.context.outputs.deploy == 'true'
        run: |
          echo "Logging in to GHCR as ${GITHUB_ACTOR}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        if: needs.context.outputs.deploy == 'true'
        env:
          IMAGE: ${{ needs.context.outputs.image }}
          IMAGE_TAG: ${{ needs.context.outputs.image_tag }}
        run: |
          echo "Tagging image as ${IMAGE}:sha-${GITHUB_SHA}"
          docker tag zerox2c-blog-api:test "${IMAGE}:sha-${GITHUB_SHA}"
          echo "Tagging image as ${IMAGE}:${IMAGE_TAG}"
          docker tag zerox2c-blog-api:test "${IMAGE}:${IMAGE_TAG}"
          echo "Pushing ${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          echo "Pushing ${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs:
      - context
      - container
    if: needs.context.outputs.deploy == 'true'
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.context.outputs.environment_url }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ needs.context.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.context.outputs.environment }}
      IMAGE: ${{ needs.context.outputs.image }}:${{ needs.context.outputs.image_tag }}
      DEFAULT_APP_PORT: ${{ needs.context.outputs.default_app_port }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      APP_HOST: ${{ secrets.APP_HOST }}
      APP_PORT: ${{ secrets.APP_PORT }}
      MYSQL_CONNECTION_STRING: ${{ secrets.MYSQL_CONNECTION_STRING }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_LIFETIME_MINUTES }}
      SUPERADMIN_USE_DEFAULT_PASSWORD: ${{ secrets.SUPERADMIN_USE_DEFAULT_PASSWORD }}
      OPENAPI_ENABLED: ${{ secrets.OPENAPI_ENABLED }}
      DEVELOPER_EXCEPTION_PAGE_ENABLED: ${{ secrets.DEVELOPER_EXCEPTION_PAGE_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        shell: bash
        run: |
          echo "Deploying image ${IMAGE}"
          echo "GitHub Environment: ${DEPLOY_ENVIRONMENT}"
          echo "Default API port: ${DEFAULT_APP_PORT}"
          echo "Deploy root: ${DEPLOY_ROOT:-/opt/0x2c-blog}"
          bash scripts/deploy.sh
