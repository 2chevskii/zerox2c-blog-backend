services:
  postgres:
    image: postgres:17-alpine
    container_name: zerox2c-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
